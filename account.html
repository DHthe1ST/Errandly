<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#111827"><title>Errandly — My Account</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#111827;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.shell{max-width:620px;min-height:100vh;margin:auto;background:#fff;padding:22px}.brand{font-weight:800;font-size:21px;margin-bottom:24px}.card{border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin-top:14px}input,textarea{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;font:inherit;margin:7px 0 12px}button{border:0;border-radius:10px;padding:12px 15px;font-weight:700;cursor:pointer}.primary{background:#111827;color:#fff;width:100%}.secondary{background:#fff;border:1px solid #d1d5db}.danger{background:#fee2e2;color:#991b1b}.error{color:#b91c1c}.muted{color:#6b7280}.hidden{display:none}.order{padding:14px;border:1px solid #e5e7eb;border-radius:13px;margin-top:10px}.status{font-size:12px;font-weight:800}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;font-size:13px;font-weight:700;margin-top:10px}.notice{background:#f9fafb;border-radius:10px;padding:10px;margin-top:10px;font-size:13px}</style></head><body><main class="shell"><div class="brand">Errandly</div>
<section id="auth" class="card"><h1 id="title">My Account</h1><p class="muted" id="intro">Create an account or sign in to manage your errands.</p><form id="form"><div id="nameWrap" class="hidden"><label>Full name</label><input id="name"></div><label>Email</label><input id="email" type="email" required autocomplete="email"><label>Password</label><input id="password" type="password" required minlength="6" autocomplete="current-password"><button class="primary" id="submit">Login</button></form><p id="error" class="error"></p><button class="secondary" id="toggle">Create an account</button></section>
<section id="portal" class="hidden"><div class="top"><div><h1>My Errands</h1><p class="muted" id="welcome"></p></div><button id="logout" class="secondary">Logout</button></div><div id="orders"><p class="muted">Loading...</p></div></section>
<dialog id="editDialog"><form method="dialog" class="card" style="margin:0"><h2>Edit errand</h2><label>Description</label><textarea id="editDescription"></textarea><label>Phone</label><input id="editPhone"><label>Location</label><input id="editLocation"><label>Pickup location</label><input id="editPickup"><label>Delivery location</label><input id="editDelivery"><p id="editError" class="error"></p><div class="actions"><button id="saveEdit" class="primary" type="button">Save changes</button><button class="secondary" type="button" id="closeEdit">Close</button></div></form></dialog>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/@supabase/supabase-js@2"></script><script>
const URL="https://qcpsvndrmfujpvrgopds.supabase.co",KEY="sb_publishable_gFMSC4gbtpEbFFM7uaIV2A_Uz54B3pc";const sb=window.supabase.createClient(URL,KEY);let signup=false,selected=null;
const $=id=>document.getElementById(id);const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
$("toggle").onclick=()=>{signup=!signup;$("nameWrap").classList.toggle("hidden",!signup);$("title").textContent=signup?"Create your account":"My Account";$("intro").textContent=signup?"Register to manage your Errandly orders.":"Create an account or sign in to manage your errands.";$("submit").textContent=signup?"Register":"Login";$("toggle").textContent=signup?"I already have an account":"Create an account";$("error").textContent=""};
$("form").onsubmit=async e=>{e.preventDefault();$("error").textContent="";const email=$("email").value.trim(),password=$("password").value;if(signup){const {data,error}=await sb.auth.signUp({email,password,data:{full_name:$("name").value.trim()}});if(error){$("error").textContent=error.message;return}if(!data.session){$("error").textContent="Account created. Check your email if confirmation is enabled, then sign in.";return}}else{const {error}=await sb.auth.signInWithPassword({email,password});if(error){$("error").textContent=error.message;return}}showPortal()};
async function showPortal(){const {data}=await sb.auth.getSession();if(!data.session){$("auth").classList.remove("hidden");$("portal").classList.add("hidden");return}$("auth").classList.add("hidden");$("portal").classList.remove("hidden");$("welcome").textContent=data.session.user.email;await loadOrders()}
async function loadOrders(){const {data:userData}=await sb.auth.getUser();const uid=userData?.user?.id;if(!uid)return;const {data,error}=await sb.from("errands").select("*").eq("customer_id",uid).order("created_at",{ascending:false});if(error){$("orders").innerHTML='<p class="error">Orders could not be loaded. Apply the 0.6 database migration first.</p>';return}if(!data?.length){$("orders").innerHTML='<p class="muted">No errands yet. Use Request an Errand from the home page.</p>';return}$("orders").innerHTML=data.map(o=>{const locked=o.status==="Cancelled";return `<article class="order"><div class="top"><strong>${esc(o.order_id)}</strong><span class="status">${esc(o.status||"Pending")}</span></div><p>${esc(o.description)}</p><small class="muted">${esc(o.type||"")} · ${esc(o.mode||"Now")}</small><div class="notice">${o.runner_id?"A runner has been assigned. Customer cancellation is locked after runner assignment, but modification remains available.":o.status==="Cancelled"?"This order is cancelled.":"No runner assigned yet. You may modify or cancel this order."}</div>${!locked?`<div class="actions"><button class="secondary" data-edit="${esc(o.order_id)}">Modify</button>${!o.runner_id?`<button class="danger" data-cancel="${esc(o.order_id)}">Cancel</button>`:""}</div>`:""}</article>`}).join("");}
$("orders").addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;const id=b.dataset.edit||b.dataset.cancel;if(!id)return;const {data}=await sb.from("errands").select("*").eq("order_id",id).single();if(!data)return;if(b.dataset.edit){selected=data;$("editDescription").value=data.description||"";$("editPhone").value=data.phone||"";$("editLocation").value=data.location||"";$("editPickup").value=data.pickup_location||"";$("editDelivery").value=data.delivery_location||"";$("editError").textContent="";$("editDialog").showModal()}else if(confirm("Cancel this errand?")){const {error}=await sb.from("errands").update({status:"Cancelled"}).eq("order_id",id);if(error)alert(error.message);else await loadOrders()}});
$("saveEdit").onclick=async()=>{if(!selected)return;const patch={description:$("editDescription").value.trim(),phone:$("editPhone").value.trim(),location:$("editLocation").value.trim()||null,pickup_location:$("editPickup").value.trim()||null,delivery_location:$("editDelivery").value.trim()||null};const {error}=await sb.from("errands").update(patch).eq("order_id",selected.order_id);if(error){$("editError").textContent=error.message;return}$("editDialog").close();await loadOrders()};$("closeEdit").onclick=()=>$("editDialog").close();$("logout").onclick=async()=>{await sb.auth.signOut();location.reload()};showPortal();
</script></body></html>
